# ============================================================
# DOCKER COMPOSE — Election Streaming (production-ready local)
# ============================================================
name: election-streaming

services:

  # ----------------------------------------------------------
  # Kafka (KRaft)
  # ----------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk=="
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - election-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: election-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - election-net

  # ----------------------------------------------------------
  # Producer
  # ----------------------------------------------------------
  producer:
    build:
      context: ./producer
    container_name: election-producer
    restart: on-failure
    environment:
      KAFKA_SERVER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-votes}
      VOTE_INTERVAL_SECONDS: ${VOTE_INTERVAL_SECONDS:-2}
      SENEGAL_VOTE_RATIO: ${SENEGAL_VOTE_RATIO:-0.80}
    volumes:
      - ./producer/app:/app
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - election-net

  # ----------------------------------------------------------
  # Spark cluster
  # ----------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: election-spark-master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      HOME: /tmp
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - spark_ivy:/tmp/.ivy2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - election-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: election-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      HOME: /tmp
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - spark_ivy:/tmp/.ivy2
    networks:
      - election-net

  spark-app:
    build:
      context: ./spark
    container_name: election-spark-app
    hostname: spark-app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      spark-master:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    environment:
      SPARK_DRIVER_HOST: spark-app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-votes}
      KAFKA_STARTING_OFFSETS: earliest
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-votes}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-10 seconds}
      SHUFFLE_PARTITIONS: ${SHUFFLE_PARTITIONS:-4}
      HOME: /tmp
    volumes:
      - ./spark/app:/app
      - spark_checkpoints:/app/checkpoints
      - spark_ivy:/root/.ivy2
    networks:
      - election-net

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres-election
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - election-net

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - election-net

  # ----------------------------------------------------------
  # MinIO
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio-election
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - election-net

  mc:
    image: minio/mc:latest
    container_name: minio-mc-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Attente MinIO...';
      i=0;
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        i=$$((i+1));
        if [ $$i -gt 30 ]; then echo 'MinIO indisponible'; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET:-votes};
      echo 'Bucket MinIO prêt';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-votes}
    networks:
      - election-net

  # ----------------------------------------------------------
  # Dashboard Streamlit
  # ----------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
    container_name: election-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - election-net

volumes:
  postgres_data:
  minio_data:
  spark_ivy:
  spark_checkpoints:

networks:
  election-net:
    driver: bridge
